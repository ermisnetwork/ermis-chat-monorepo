name: Publish SDKs to NPM

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - name: Install Dependencies
        run: yarn install

      - name: Build SDK and React
        run: yarn build

      - name: Verify NPM package names
        run: |
          test "$(node -p "require('./packages/ermis-chat-sdk/package.json').name")" = "@ermis-network/ermis-chat-sdk"
          test "$(node -p "require('./packages/ermis-chat-react/package.json').name")" = "@ermis-network/ermis-chat-react"
          test "$(node -p "require('./packages/ermis-chat-react/package.json').dependencies['@ermis-network/ermis-chat-sdk']")" = "$(node -p "require('./packages/ermis-chat-sdk/package.json').version")"

      - name: Publish @ermis-network/ermis-chat-sdk to NPM
        run: cd packages/ermis-chat-sdk && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @ermis-network/ermis-chat-react to NPM
        run: cd packages/ermis-chat-react && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
